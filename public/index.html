<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="public/image/logo.jpg" type="image/x-png">
    <title>PROFYNE LABS - AI Stock Metadata Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-xl"><img src="image/logo.jpg"
                    class="w-[40px] rounded-lg">
            </div>
            <span class="text-xl font-bold tracking-wider text-white">PROFYNE <span
                    class="text-indigo-400">LABS</span></span>
        </div>
        <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full">AI
            Metadata Tool v1.0</span>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl mx-auto w-full p-6 space-y-8">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-white sm:text-4xl">AI Microstock Metadata Generator</h1>
            <p class="text-slate-400">Upload your artwork to instantly generate SEO titles & high-ranking keywords for
                Adobe Stock.</p>
        </div>

        <!-- Upload Box -->
        <div
            class="bg-slate-800/50 border-2 border-dashed border-slate-700 hover:border-indigo-500 transition rounded-2xl p-8 text-center space-y-4">
            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
            <label for="imageInput" class="cursor-pointer block space-y-3">
                <div id="previewContainer" class="hidden flex justify-center">
                    <img id="imgPreview" class="max-h-48 rounded-lg border border-slate-700 shadow-md">
                </div>
                <div id="uploadPrompt" class="space-y-2">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-indigo-400"></i>
                    <p class="text-slate-200 font-medium">Click to upload or drag & drop your image</p>
                    <p class="text-xs text-slate-400">Supports JPG, PNG, WEBP</p>
                </div>
            </label>
            <button onclick="generateMetadata()" id="btnGenerate"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl transition flex justify-center items-center space-x-2">
                <span>Generate Metadata</span>
            </button>
        </div>

        <!-- Loader -->
        <div id="loader" class="hidden text-center py-8 space-y-3">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent">
            </div>
            <p class="text-slate-400 text-sm">Analyzing image details with AI...</p>
        </div>

        <!-- Results Section -->
        <div id="results" class="hidden space-y-6 bg-slate-800/30 border border-slate-800 p-6 rounded-2xl">
            <!-- Title -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-xs uppercase font-bold text-slate-400">Title</label>
                    <button onclick="copyText('resTitle')" class="text-xs text-indigo-400 hover:underline"><i
                            class="fa-regular fa-copy"></i> Copy Title</button>
                </div>
                <div id="resTitle" class="bg-slate-900 p-3 rounded-lg text-slate-200 border border-slate-800"></div>
            </div>

            <!-- Category -->
            <div class="space-y-2">
                <label class="text-xs uppercase font-bold text-slate-400">Category</label>
                <div id="resCategory"
                    class="bg-slate-900 p-3 rounded-lg text-slate-200 border border-slate-800 inline-block text-sm">
                </div>
            </div>

            <!-- Keywords -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-xs uppercase font-bold text-slate-400">Keywords (<span
                            id="kwCount">0</span>)</label>
                    <button onclick="copyText('resKeywords')" class="text-xs text-indigo-400 hover:underline"><i
                            class="fa-regular fa-copy"></i> Copy All Keywords</button>
                </div>
                <div id="resKeywords"
                    class="bg-slate-900 p-4 rounded-lg text-slate-300 border border-slate-800 text-sm leading-relaxed">
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-slate-500 border-t border-slate-800/50 text-xs">
        © 2026 PROFYNE LABS. All rights reserved.
    </footer>

    <script>
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('uploadPrompt').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        async function generateMetadata() {
            const fileInput = document.getElementById('imageInput');
            if (!fileInput.files[0]) return alert('Please upload an image first!');

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                const res = await fetch('/api/generate-metadata', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('resTitle').innerText = data.metadata.title;
                    document.getElementById('resCategory').innerText = data.metadata.category;
                    document.getElementById('resKeywords').innerText = data.metadata.keywords.join(', ');
                    document.getElementById('kwCount').innerText = data.metadata.keywords.length;
                    document.getElementById('results').classList.remove('hidden');
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                alert('Server error! Make sure backend server is running.');
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard!');
        }
    </script>
</body>

</html>
